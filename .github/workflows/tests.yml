name: Package tests

on:
  # L6 (#20 mục 5) — kho này là một package có nhiều tài liệu (`LOGIN-FLOW.md`…),
  # và trước đây sửa một tệp `.md` kích cả E2E hai consumer. Viết lặp ở cả hai sự
  # kiện: trình đọc workflow của GitHub không nở anchor YAML, và một filter chỉ
  # đặt ở `push` không ngăn được lượt `pull_request` của đúng sha đó.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  # #20 mục 6 — TRƯỚC ĐÂY WORKFLOW NÀY CHỈ NGHE `push: main`, nghĩa là một PR
  # không chạy MỘT bài test nào trước khi merge. Với một package mà hai kho khác
  # phụ thuộc, đó là lỗ hổng lớn hơn mọi con số về thời gian trong issue.
  pull_request:
    # `labeled` PHẢI có, nếu không cổng nhãn `run-e2e` bên dưới không dùng được.
    # Mặc định của `pull_request` là [opened, synchronize, reopened]; gắn nhãn
    # KHÔNG nằm trong đó, nên luồng tự nhiên — mở PR, thấy cần E2E, gắn nhãn —
    # không kích lại gì cả, và job vẫn `skipping`. Đo trực tiếp trên PR #24:
    # gắn nhãn xong, `Two-consumer browser E2E` vẫn `skipping` cho tới khi có
    # một push mới.
    #
    # Ngược lại, KHÔNG thu về riêng `types: [labeled]`: thế thì cổng đóng băng ở
    # một thời điểm và không bao giờ chạy lại cho commit sau (godx-tiximax-jp#29).
    # Cần cả bốn.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'

# L7 (#20 mục 4) — push thứ hai làm kết quả push thứ nhất vô nghĩa.
# Khoá theo TÊN NHÁNH chứ không `github.ref`: `push` sinh `refs/heads/<nhánh>`,
# `pull_request` sinh `refs/pull/N/merge` — hai chuỗi khác nhau nên KHÔNG bao giờ
# gộp được, và một nhánh có PR sẽ chạy hai lượt song song (đo ở godx-tiximax#393).
concurrency:
  group: tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  # KHÔNG huỷ trên `main`: lượt ở đó là bằng chứng của cổng, và một entry
  # "cancelled" trong lịch sử trunk đọc y hệt một lượt đỏ.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# RUNNER — `[self-hosted, swarm-pool]` cho mọi job, không phải `ubuntu-latest`:
# runner của GitHub tính tiền, đàn swarm-pool thì không. Runner là container
# phù du (image `tempo-runner-php:noble`, Ubuntu 24.04): mỗi job một container
# mới, PHP 8.4 + Composer + Node 22 + Chromium của Playwright nằm sẵn trong image.
#
# KHÔNG dùng `setup-php` / `setup-node`, và KHÔNG cài gì cả. Đo ở godx-chat trên
# chính đàn này: `setup-php` 81s dù PHP đã có sẵn (nó không nhận bản cài sẵn là
# "của nó"), `setup-node` 123s để tải một thứ không đổi giữa hai lượt. Khẳng
# định, đừng cài — image trôi mất thứ gì thì job đỏ NGAY tại bước khẳng định với
# một câu nói rõ nguyên nhân, thay vì đỏ rải rác ở test.
jobs:
  test:
    name: PHP 8.4
    runs-on: [self-hosted, swarm-pool]

    steps:
      - uses: actions/checkout@v4

      # `openssl` vì composer.json đòi `ext-openssl`; `pdo_sqlite` cho testbench;
      # `mbstring` cho mọi chuỗi tiếng Việt/Nhật.
      - name: Khẳng định toolchain PHP của image
        run: |
          php -v | head -1
          php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' \
            || { echo "::error::image runner cần PHP >= 8.4"; exit 1; }
          for ext in openssl mbstring pdo_sqlite; do
            php -m | grep -qx "$ext" \
              || { echo "::error::image runner thiếu extension '$ext' — xem chú thích ở đầu workflow"; exit 1; }
          done
          composer --version

      # `$HOME` trên runner dùng chung không thuộc về CI. Trỏ COMPOSER_HOME vào
      # thư mục tạm của lượt chạy, và mồi kho tải đã bake sẵn trong image —
      # container phù du nên `vendor/` phải dựng lại mỗi job.
      - name: Composer không đọc HOME dùng chung
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.composer-cache"
          [ -d /opt/composer-cache ] && cp -a /opt/composer-cache/. "$GITHUB_WORKSPACE/.composer-cache/" 2>/dev/null || true
          echo "COMPOSER_CACHE_DIR=$GITHUB_WORKSPACE/.composer-cache" >> "$GITHUB_ENV"

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test

  browser-e2e:
    name: Two-consumer browser E2E
    # L4 (#20 mục 1) — làn CHẬM, KHÔNG gác merge. Job này đo 462s, tức 67% wall
    # của cả lượt, trong khi `PHP 8.4` chỉ 55s. Giá trị của một bộ E2E hai
    # consumer không đổi khi nó chạy trên trunk thay vì trên từng PR.
    #
    # Nên: mọi `push: main` vẫn chạy nó (trunk vẫn được gác đầy đủ), còn PR thì
    # chỉ chạy khi được gắn nhãn `run-e2e` — đúng cơ chế issue đề xuất. PR nào
    # đụng luồng đăng nhập thì gắn nhãn; PR còn lại vẫn có cổng `PHP 8.4`, thứ
    # trước đây KHÔNG hề chạy trên PR.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: [self-hosted, swarm-pool]

    env:
      # Chromium của Playwright nằm sẵn trong image ở `/opt/ms-playwright`
      # (bake theo playwright 1.62.1). `run.sh` vẫn gọi `playwright install
      # chromium`: KHỚP bản thì bước ấy chỉ kiểm-và-thoát (0,5s).
      #
      # Trước 2026-09-19 nó KHÔNG khớp — `tests/e2e` khoá 1.61.1 trong khi image
      # bake 1.62.1, nên mỗi lượt E2E tải lại trình duyệt vào cùng thư mục. Đo
      # trên run 35379526243: hai bản tải, 18:20:46 → 18:21:12 = **26 giây mỗi
      # lượt**, cho một thứ image đã có sẵn.
      #
      # Gốc rễ là dải semver: `^1.55.0` bao cả 1.61.1 lẫn 1.62.1, nên lockfile
      # trôi khỏi image mà không gì báo. Playwright ghim một bản TRÌNH DUYỆT cụ
      # thể, nên nó phải được ghim CHÍNH XÁC bằng bản đã bake — caret ở đây biến
      # `npm ci` và `npm install` thành hai môi trường khác nhau. Nay là `1.62.1`
      # không caret; đổi image thì phải đổi cả con số này.
      #
      # KHÔNG trỏ về `~/.cache` mặc định: `$HOME` trên runner dùng chung không
      # thuộc về CI.
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright

    steps:
      - uses: actions/checkout@v4

      # `run.sh` dùng `zip` và `shasum` ngoài PHP/Composer — đã dò image gốc
      # (myoung34/github-runner:ubuntu-noble) có cả hai; khẳng định để lỡ image
      # đổi thì đỏ ở đây chứ không đỏ giữa chừng script.
      - name: Khẳng định toolchain PHP của image
        run: |
          php -v | head -1
          php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);' \
            || { echo "::error::image runner cần PHP >= 8.4"; exit 1; }
          for ext in openssl mbstring pdo_sqlite; do
            php -m | grep -qx "$ext" \
              || { echo "::error::image runner thiếu extension '$ext' — xem chú thích ở đầu workflow"; exit 1; }
          done
          composer --version
          for cmd in zip shasum; do
            command -v "$cmd" >/dev/null \
              || { echo "::error::image runner thiếu lệnh '$cmd' — tests/e2e/run.sh cần nó"; exit 1; }
          done

      - name: Khẳng định toolchain Node của image
        run: |
          node --version | grep '^v22\.' >/dev/null \
            || { echo "::error::image runner cần Node 22"; exit 1; }
          npm --version

      - name: Composer và npm không đọc HOME dùng chung
        run: |
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.composer-cache"
          [ -d /opt/composer-cache ] && cp -a /opt/composer-cache/. "$GITHUB_WORKSPACE/.composer-cache/" 2>/dev/null || true
          echo "COMPOSER_CACHE_DIR=$GITHUB_WORKSPACE/.composer-cache" >> "$GITHUB_ENV"
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - run: ./tests/e2e/run.sh

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: tests/e2e/artifacts/
          retention-days: 14
